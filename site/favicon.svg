<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 62 62">
  <style>
    .g { fill: #6b6b6b; }
    @media (prefers-color-scheme: light) { .g { fill: #9a9a9a; } }
  </style>
  <defs>
    <clipPath id="robin">
      <ellipse cx="30" cy="36" rx="18" ry="15"/>
      <circle cx="45" cy="23" r="10"/>
      <polygon points="53,19.5 61.5,23.5 53,27"/>
      <polygon points="15,32 2,43 6,48 19,40"/>
